# AI-native SDLC 的唯一事实源。
# 修改配置后运行：npx create-ai-native-sdlc sync .
schemaVersion: 1
templateSet: core/v1

project:
  id: {{PROJECT_ID_JSON}}
  name: {{PROJECT_NAME_JSON}}
  summary: {{PROJECT_SUMMARY_JSON}}
  owner: "One Person Company"
  locale: zh-CN
  stack: []
  commands:
    setup: ""
    build: ""
    test: ""
    lint: ""

paths:
  baseline: .ai-sdlc/baseline
  roles: .ai-sdlc/roles
  artifacts: docs/ai-sdlc

integrations:
  githubCopilot: true
  claudeCode: true
  codex: true

roles:
  - id: pm-ba
    name: PM / BA
    enabled: true
    mission: 把商业目标转化为清晰、可验证的产品需求。
    responsibilities:
      - 识别用户问题、价值假设与业务边界
      - 编写需求、验收标准并维护优先级
      - 维护需求到交付物的可追踪性
    deliverables:
      - product-brief
      - requirements
  - id: designer
    name: Designer
    enabled: true
    mission: 把需求转化为一致、可用且可实现的体验方案。
    responsibilities:
      - 定义关键用户旅程与交互状态
      - 记录信息架构、视觉约束和无障碍要求
      - 与工程和测试角色共同澄清边界状态
    deliverables:
      - design-spec
  - id: architect
    name: Architect
    enabled: true
    mission: 定义满足业务目标和质量属性的技术方案。
    responsibilities:
      - 识别架构约束、风险和关键决策
      - 定义组件边界、接口、数据与安全模型
      - 确保方案可演进、可测试和可运维
    deliverables:
      - architecture
  - id: software-engineer
    name: Software Engineer
    enabled: true
    mission: 以最小、可维护和可验证的变更交付软件。
    responsibilities:
      - 根据批准的需求与架构实现功能
      - 编写自动化测试并保持变更范围清晰
      - 记录实现决策、限制与剩余风险
    deliverables:
      - implementation-plan
  - id: tester
    name: Tester
    enabled: true
    mission: 用基于风险的验证证明产品满足约定质量。
    responsibilities:
      - 从验收标准设计功能与非功能测试
      - 验证关键路径、失败模式和回归风险
      - 提供可复现的缺陷证据和发布质量结论
    deliverables:
      - test-plan
  - id: devops
    name: DevOps
    enabled: true
    mission: 建立可重复、可观察且可回滚的交付路径。
    responsibilities:
      - 自动化构建、发布、部署和环境配置
      - 定义可观察性、告警、备份与恢复要求
      - 验证发布、回滚和运行手册
    deliverables:
      - release-runbook

workflow:
  phases:
    - id: discovery
      name: Discovery
      owner: pm-ba
      inputs: []
      outputs: [product-brief, requirements]
      gate: 问题、目标用户、范围和验收标准已明确。
    - id: design
      name: Design
      owner: designer
      inputs: [requirements]
      outputs: [design-spec]
      gate: 关键流程、状态和体验约束可实现且可验证。
    - id: architecture
      name: Architecture
      owner: architect
      inputs: [requirements, design-spec]
      outputs: [architecture]
      gate: 关键技术决策、风险和质量属性已有明确处理方案。
    - id: implementation
      name: Implementation
      owner: software-engineer
      inputs: [requirements, design-spec, architecture]
      outputs: [implementation-plan]
      gate: 实现通过本地质量检查并与批准范围一致。
    - id: verification
      name: Verification
      owner: tester
      inputs: [requirements, design-spec, architecture, implementation-plan]
      outputs: [test-plan]
      gate: 验收标准、关键风险和回归范围均有验证证据。
    - id: release
      name: Release
      owner: devops
      inputs: [architecture, test-plan]
      outputs: [release-runbook]
      gate: 发布、观察和回滚路径已经验证。
  definitionOfDone:
    - 交付物可追踪到已批准的需求与验收标准
    - 自动化测试和静态检查通过，或例外有明确记录
    - 安全、隐私、性能与可访问性风险已评估
    - 运维监控、发布步骤和回滚方案已准备
    - 关键决策、限制和未解决风险已写入相应产物

baselines:
  - id: project-charter
    title: Project Charter
    template: project-charter
    output: .ai-sdlc/baseline/project-charter.md
  - id: workflow
    title: Delivery Workflow
    template: workflow
    output: .ai-sdlc/baseline/workflow.md
  - id: definition-of-done
    title: Definition of Done
    template: definition-of-done
    output: .ai-sdlc/baseline/definition-of-done.md
  - id: role-registry
    title: Role Registry
    template: role-registry
    output: .ai-sdlc/baseline/role-registry.md

artifacts:
  - id: product-brief
    title: Product Brief
    owner: pm-ba
    template: product-brief
    output: docs/ai-sdlc/product/product-brief.md
    mode: seed
  - id: requirements
    title: Requirements
    owner: pm-ba
    template: requirements
    output: docs/ai-sdlc/product/requirements.md
    mode: seed
  - id: design-spec
    title: Design Specification
    owner: designer
    template: design-spec
    output: docs/ai-sdlc/design/design-spec.md
    mode: seed
  - id: architecture
    title: Architecture
    owner: architect
    template: architecture
    output: docs/ai-sdlc/architecture/architecture.md
    mode: seed
  - id: implementation-plan
    title: Implementation Plan
    owner: software-engineer
    template: implementation-plan
    output: docs/ai-sdlc/engineering/implementation-plan.md
    mode: seed
  - id: test-plan
    title: Test Plan
    owner: tester
    template: test-plan
    output: docs/ai-sdlc/testing/test-plan.md
    mode: seed
  - id: release-runbook
    title: Release Runbook
    owner: devops
    template: release-runbook
    output: docs/ai-sdlc/operations/release-runbook.md
    mode: seed

generation:
  maxParallelAgents: 6
