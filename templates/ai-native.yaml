# AI-native 工作流的唯一配置入口。
version: 1

project:
  name: {{PROJECT_NAME}}
  summary: {{PROJECT_SUMMARY}}
  locale: zh-CN

agent:
  client: {{AI_CLIENT}}

paths:
  agents: {{AGENTS_DIRECTORY}}
  outputs: docs

roles:
  - id: pm-ba
    name: PM / BA
    mission: Route each immutable change contract to the smallest sufficient product evidence without rewriting a project PRD for every Run.
    responsibilities: [change impact, user problems, business rules, product scope, acceptance criteria]
  - id: designer
    name: Designer
    mission: Turn confirmed product needs into clear interface behavior and a developer-ready design handoff.
    responsibilities: [user journeys, interaction states, responsive behavior, accessibility, design validation]
  - id: architect
    name: Architect
    mission: Turn confirmed product and design intent into an evidence-based architecture decision pack.
    responsibilities: [architecture options, system boundaries, decision records, measurable quality budgets]
  - id: software-engineer
    name: Software Engineer
    mission: Turn confirmed contracts into the smallest complete software change and an independently verifiable engineering evidence pack.
    responsibilities: [implementation, acceptance traceability, independent test evidence, engineering review, provenance]
  - id: tester
    name: Tester
    mission: Turn confirmed requirements and risks into independent, repeatable verification; use Playwright MCP only for exploration and standalone repository tests for reusable E2E evidence.
    responsibilities: [risk-based test design, browser exploration, E2E evidence audit, standalone execution, defect evidence, release-quality recommendation]
  - id: devops
    name: DevOps
    mission: 建立可重复、可观察、可回滚的交付路径。
    responsibilities: [CI/CD, 部署, 监控, 回滚]

workflow:
  phases:
    - id: discovery
      owner: pm-ba
      inputs: []
      outputs: [change-contract, prd, user-stories]
      gate: The immutable Run change contract exists and the selected product disposition has sufficient scope, business-rule, acceptance, and regression evidence.
    - id: design
      owner: designer
      inputs: [change-contract, prd, user-stories]
      outputs: [design-baseline, design-spec, design-prototype, figma-handoff]
      gate: An explicit design disposition is recorded; skip and reuse have valid evidence, or the selected design outputs are complete, traceable, ready-for-engineering, and unblocked. Checks that require the runnable implementation are recorded as Tester-owned deferred validations, never as Design blockers.
    - id: architecture
      owner: architect
      inputs: [change-contract, prd, user-stories, design-spec]
      outputs: [architecture, architecture-discovery-context, architecture-options, architecture-c4-context, architecture-c4-containers, architecture-adrs, architecture-patterns, architecture-nfrs, architecture-adversarial]
      gate: Human acceptance evidence is recorded after the selected direction, C4 views, decisions, quality budgets, risks, and open human decisions are complete.
    - id: implementation
      owner: software-engineer
      inputs: [change-contract, prd, user-stories, design-baseline, design-spec, architecture, architecture-c4-containers, architecture-adrs, architecture-patterns, architecture-nfrs]
      outputs: [implementation-notes, implementation-plan, implementation-tasks, engineering-session-log, engineering-test-evidence, engineering-review, engineering-provenance]
      gate: The confirmed implementation and necessary tests are complete; every acceptance criterion has independent test evidence, all seven review lenses and the adversarial pass are complete, and the provenance chain has no unresolved blocker.
    - id: verification
      owner: tester
      inputs: [change-contract, prd, user-stories, design-spec, architecture, architecture-nfrs, implementation-notes, engineering-test-evidence, engineering-review]
      outputs: [test-report]
      gate: Acceptance criteria, targeted regressions, main risks, and every selected deferred Design validation have current execution evidence; Playwright MCP exploration alone never satisfies repeatable E2E or CI evidence.
    - id: release
      owner: devops
      inputs: [architecture, architecture-adrs, architecture-nfrs, architecture-adversarial, test-report]
      outputs: [release-runbook]
      gate: 发布、监控和回滚步骤已准备。

artifacts:
  # path 相对于 paths.outputs；修改 outputs 即可整体迁移 AI 产物目录。
  # PM/BA 的 path 会拼接角色 config.output.subdirectory。
  # change-contract 由平台按 Run 生成任务级文件；这里的 path 是非平台客户端使用的基名。
  - { id: change-contract, owner: pm-ba, path: change-contract.md }
  - { id: prd, owner: pm-ba, path: prd.md }
  - { id: user-stories, owner: pm-ba, path: user-stories }
  # Designer 的 path 是文件名，最终目录还会拼接角色 config.output.subdirectory。
  - { id: design-baseline, owner: designer, path: DESIGN_BASELINE.md }
  # design-spec.md 是配置基名；平台执行时会解析为“任务名--run-id-design-spec.md”。
  - { id: design-spec, owner: designer, path: design-spec.md }
  - { id: design-prototype, owner: designer, path: prototype.html }
  - { id: figma-handoff, owner: designer, path: figma-handoff.md }
  # Architect paths are resolved under the role config output.subdirectory.
  # architecture.md is the pack index; 04-adrs is a directory of ADR files.
  - { id: architecture, owner: architect, path: architecture.md }
  - { id: architecture-discovery-context, owner: architect, path: 00-discovery-context.md }
  - { id: architecture-options, owner: architect, path: 00-options.md }
  - { id: architecture-c4-context, owner: architect, path: 01-context.mmd }
  - { id: architecture-c4-containers, owner: architect, path: 02-containers.mmd }
  - { id: architecture-adrs, owner: architect, path: 04-adrs }
  - { id: architecture-patterns, owner: architect, path: 05-patterns.md }
  - { id: architecture-nfrs, owner: architect, path: 06-nfrs.md }
  - { id: architecture-adversarial, owner: architect, path: 07-adversarial.md }
  # Software Engineer paths are resolved under its role config output.subdirectory.
  # All seven evidence documents receive stable Run-scoped filenames in platform executions.
  - { id: implementation-notes, owner: software-engineer, path: implementation-notes.md }
  - { id: implementation-plan, owner: software-engineer, path: implementation-plan.md }
  - { id: implementation-tasks, owner: software-engineer, path: implementation-tasks.md }
  - { id: engineering-session-log, owner: software-engineer, path: session-log.md }
  - { id: engineering-test-evidence, owner: software-engineer, path: independent-test-evidence.md }
  - { id: engineering-review, owner: software-engineer, path: review.md }
  - { id: engineering-provenance, owner: software-engineer, path: pr-provenance.md }
  - { id: test-report, owner: tester, path: ai-native/testing/test-report.md }
  - { id: release-runbook, owner: devops, path: ai-native/operations/release-runbook.md }
