# AI-native 工作流的唯一配置入口。
version: 1

project:
  name: {{PROJECT_NAME}}
  summary: {{PROJECT_SUMMARY}}
  locale: zh-CN

paths:
  agents: {{AGENTS_DIRECTORY}}
  outputs: docs

roles:
  - id: pm-ba
    name: PM / BA
    mission: 把业务目标转成清晰、可验证的需求。
    responsibilities: [产品目标, 业务分析, 需求, 验收标准]
  - id: designer
    name: Designer
    mission: 把需求转成可用、可实现的体验方案。
    responsibilities: [用户旅程, 交互状态, 视觉与无障碍]
  - id: architect
    name: Architect
    mission: 定义系统边界、接口和关键技术决策。
    responsibilities: [架构方案, 数据与接口, 安全与质量属性]
  - id: software-engineer
    name: Software Engineer
    mission: 实现功能并提供可验证的工程结果。
    responsibilities: [实现, 自动化测试, 代码质量]
  - id: tester
    name: Tester
    mission: 验证需求、风险和回归范围。
    responsibilities: [测试设计, 缺陷证据, 发布质量结论]
  - id: devops
    name: DevOps
    mission: 建立可重复、可观察、可回滚的交付路径。
    responsibilities: [CI/CD, 部署, 监控, 回滚]

workflow:
  phases:
    - id: discovery
      owner: pm-ba
      inputs: []
      outputs: [product-brief, requirements]
      gate: 产品问题、范围和验收标准已明确。
    - id: design
      owner: designer
      inputs: [requirements]
      outputs: [design-baseline, design-spec]
      gate: 关键用户流程和状态已明确。
    - id: architecture
      owner: architect
      inputs: [requirements, design-spec]
      outputs: [architecture]
      gate: 技术边界、风险和关键决策已明确。
    - id: implementation
      owner: software-engineer
      inputs: [requirements, design-spec, architecture]
      outputs: [implementation-notes]
      gate: 实现和必要测试完成。
    - id: verification
      owner: tester
      inputs: [requirements, implementation-notes]
      outputs: [test-report]
      gate: 验收标准和主要风险已有验证证据。
    - id: release
      owner: devops
      inputs: [architecture, test-report]
      outputs: [release-runbook]
      gate: 发布、监控和回滚步骤已准备。

artifacts:
  # path 相对于 paths.outputs；修改 outputs 即可整体迁移 AI 产物目录。
  - { id: product-brief, owner: pm-ba, path: ai-native/product/product-brief.md }
  - { id: requirements, owner: pm-ba, path: ai-native/product/requirements.md }
  # Designer 的 path 是文件名，最终目录还会拼接角色 config.output.subdirectory。
  - { id: design-baseline, owner: designer, path: DESIGN_BASELINE.md }
  - { id: design-spec, owner: designer, path: design-spec.md }
  - { id: architecture, owner: architect, path: ai-native/architecture/architecture.md }
  - { id: implementation-notes, owner: software-engineer, path: ai-native/engineering/implementation-notes.md }
  - { id: test-report, owner: tester, path: ai-native/testing/test-report.md }
  - { id: release-runbook, owner: devops, path: ai-native/operations/release-runbook.md }
